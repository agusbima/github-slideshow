const $=id=>document.getElementById(id);
const lerp=(a,b,k)=>a+(b-a)*k, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};

/* ---------- pembuat karakter ---------- */
function charSVG(p,o){
 const s=o.skin, F=o.kind==='f';
 const arm=(id)=>`<g id="${p}${id}"><rect x="-17" y="-6" width="34" height="100" rx="16" fill="${o.sleeve}"/>

   ${F?`<rect x="-16" y="-6" width="32" height="34" rx="14" fill="${o.sleeve}"/><rect x="-15" y="70" width="30" height="6" rx="3" fill="#f1c40f"/>`:`<rect x="-15" y="70" width="30" height="12" rx="5" fill="#b02a1e"/>`}
   <circle cx="0" cy="92" r="19" fill="${s}"/></g></g>`;
 const foot=(x)=>`<g class="${p}feet"><ellipse cx="${x}" cy="-6" rx="30" ry="14" fill="${s}"/>
   <g class="${p}sandal" opacity="0"><ellipse cx="${x}" cy="-2" rx="34" ry="12" fill="#8e5a2b"/><path d="M${x-18} -10 q18 -16 36 0" stroke="#c0392b" stroke-width="7" fill="none"/></g>
   ${o.shoes?`<ellipse cx="${x}" cy="-8" rx="34" ry="16" fill="${o.shoes}"/>`:''}</g>`;
 const legsStand=`<g id="${p}Stand">
   <g id="${p}LL" transform="translate(-30,-205)"><rect x="-24" y="0" width="48" height="205" rx="18" fill="${o.pants}"/><g transform="translate(0,205)">${foot(-4)}</g></g>
   <g id="${p}LR" transform="translate(30,-205)"><rect x="-24" y="0" width="48" height="205" rx="18" fill="${o.pants}"/><g transform="translate(0,205)">${foot(4)}</g></g></g>`;
 const legsSit=`<g id="${p}Sit" opacity="0">
   <rect x="-68" y="-135" width="136" height="60" rx="26" fill="${o.pants}"/>
   <rect x="-56" y="-100" width="44" height="100" rx="18" fill="${o.pants}"/><rect x="12" y="-100" width="44" height="100" rx="18" fill="${o.pants}"/>
   <g transform="translate(-34,0)">${foot(-4)}</g><g transform="translate(34,0)">${foot(4)}</g></g>`;
 const torso=F?`
   <path d="M-70 -395 q70 -25 140 0 l26 300 q-96 26 -192 0z" fill="${o.shirt}"/>
   <path d="M-40 -395 q40 60 80 0" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/>
   <path d="M-50 -330 l100 0" stroke="#5aa9d6" stroke-width="4" stroke-dasharray="6 8"/>
   <path d="M-96 -96 q96 26 192 0" stroke="#5aa9d6" stroke-width="6" fill="none"/>`
  :`<path d="M-72 -395 q72 -22 144 0 l8 200 q-80 14 -160 0z" fill="${o.shirt}"/>
   <path d="M-26 -398 l26 34 l26 -34" fill="#fff" stroke="#fff" stroke-width="2"/><path d="M-30 -400 l30 40 l-6 -40z M30 -400 l-30 40 l6 -40z" fill="#b02a1e"/>
   <g fill="#fff"><circle cx="0" cy="-330" r="4"/><circle cx="0" cy="-290" r="4"/><circle cx="0" cy="-250" r="4"/></g>
   <rect x="-38" y="-360" width="26" height="30" rx="4" fill="#b02a1e"/>
   <rect x="-82" y="-205" width="164" height="22" rx="8" fill="#5a3b1e"/><rect x="-14" y="-205" width="28" height="22" rx="4" fill="#d4ac0d"/>`;
 const dupatta=F?`<path d="M-72 -398 q72 120 144 0 l4 26 q-76 130 -152 0z" fill="${o.scarf}" opacity=".95"/>
   <path d="M60 -398 q30 40 22 230 l-30 0 q6 -150 -22 -224z" fill="${o.scarf}"/>`:'';
 const hairBack=F?`<path d="M-86 -20 q-20 -110 86 -112 q106 2 86 112 q6 70 -10 120 l-150 0 q-18 -50 -12 -120z" fill="${o.hair}"/>
   <g fill="${o.hair}"><ellipse cx="74" cy="100" rx="18" ry="24"/><ellipse cx="78" cy="138" rx="16" ry="22"/><ellipse cx="80" cy="172" rx="14" ry="20"/></g>
   <circle cx="80" cy="196" r="8" fill="#e74c3c"/>`:'';
 const hairFront=F?`<path d="M-80 -18 q-6 -100 80 -100 q86 0 80 100 q-20 -50 -80 -60 q-60 10 -80 60z" fill="${o.hair}"/>
   <path d="M0 -118 l0 40" stroke="#d63031" stroke-width="5"/>`
  :`<path d="M-80 -10 q-14 -110 76 -110 q96 -2 86 104 q-12 -40 -30 -56 q-30 18 -70 6 q-40 12 -62 56z" fill="${o.hair}"/>`;
 const extra=F?`<circle cx="0" cy="-48" r="5" fill="#d63031"/><circle cx="-80" cy="22" r="7" fill="#f1c40f"/><circle cx="80" cy="22" r="7" fill="#f1c40f"/>`
  :`<path d="M-34 28 q34 -18 68 0 q-14 14 -34 6 q-20 8 -34 -6z" fill="${o.hair}" id="${p}Must"/>`;
 return `<g id="${p}Root"><g id="${p}Bob">
  <ellipse cx="0" cy="0" rx="90" ry="16" fill="#000" opacity=".18" id="${p}Shadow"/>
  ${legsStand}${legsSit}
  <g id="${p}Upper">
   <g transform="translate(-66,-378)">${arm('AL')}</g>
   ${torso}
   <rect x="-20" y="-440" width="40" height="50" rx="12" fill="${s}"/>
   ${dupatta}
   <g transform="translate(66,-378) scale(-1,1)">${arm('AR')}</g>
   <g id="${p}Head" transform="translate(0,-505)">
    ${hairBack}
    <ellipse cx="-80" cy="8" rx="16" ry="22" fill="${s}"/><ellipse cx="80" cy="8" rx="16" ry="22" fill="${s}"/>
    <ellipse cx="0" cy="0" rx="82" ry="90" fill="${s}"/>
    <ellipse id="${p}Red" cx="0" cy="10" rx="70" ry="60" fill="#ff3b30" opacity="0"/>
    <ellipse cx="-48" cy="36" rx="22" ry="13" fill="url(#blush)" id="${p}BlL"/><ellipse cx="48" cy="36" rx="22" ry="13" fill="url(#blush)" id="${p}BlR"/>
    ${hairFront}
    <g id="${p}EyesO">
     <g transform="translate(-32,0)"><ellipse id="${p}ScL" rx="17" ry="19" fill="#fff"/><g id="${p}PuL"><circle r="11" fill="#2b1a10"/><circle cx="4" cy="-4" r="4" fill="#fff"/></g></g>
     <g transform="translate(32,0)"><ellipse id="${p}ScR" rx="17" ry="19" fill="#fff"/><g id="${p}PuR"><circle r="11" fill="#2b1a10"/><circle cx="4" cy="-4" r="4" fill="#fff"/></g></g>
     <g id="${p}Lid" fill="${s}"><rect x="-52" y="-24" width="40" height="20"/><rect x="12" y="-24" width="40" height="20"/></g>
     ${F?`<g stroke="#2b1a10" stroke-width="4" stroke-linecap="round"><path d="M-48 -14 l-8 -6"/><path d="M48 -14 l8 -6"/></g>`:''}
    </g>
    <g id="${p}EyesC" stroke="#2b1a10" stroke-width="6" fill="none" stroke-linecap="round" opacity="0"><path d="M-46 2 q14 10 28 0"/><path d="M18 2 q14 10 28 0"/></g>
    <g id="${p}EyesH" stroke="#2b1a10" stroke-width="6" fill="none" stroke-linecap="round" opacity="0"><path d="M-46 6 q14 -16 28 0"/><path d="M18 6 q14 -16 28 0"/></g>
    <g stroke="${o.hair}" stroke-width="8" fill="none" stroke-linecap="round"><path id="${p}BrL"/><path id="${p}BrR"/></g>
    <path d="M-4 18 q4 12 8 0" stroke="#00000033" stroke-width="4" fill="none"/>
    <g transform="translate(0,52)">
     <ellipse id="${p}MT" rx="14" ry="4" fill="#7a1f24"/>
     <path id="${p}MI" stroke="#7a1f24" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    ${extra}
    <path id="${p}Sweat" d="M72 -50 q14 22 0 34 q-14 -12 0 -34z" fill="#8fd6ff" stroke="#3a9ad9" stroke-width="3" opacity="0"/>
   </g>
  </g>
 </g></g>`;
}
$('suami').innerHTML=charSVG('s',{kind:'m',skin:'#c98b5e',shirt:'#d63031',sleeve:'#d63031',pants:'#33507e',hair:'#1b1310',shoes:'#3b2a1e'});
$('istri').innerHTML=charSVG('i',{kind:'f',skin:'#dca47c',shirt:'#9fd3f0',sleeve:'#9fd3f0',pants:'#cfeaf8',hair:'#1b1310',scarf:'#62b3e0'});
$('anak').innerHTML=charSVG('a',{kind:'m',skin:'#c58a5c',shirt:'#f1c40f',sleeve:'#f1c40f',pants:'#2c3e50',hair:'#1b1310',shoes:'#333'});
document.querySelectorAll('#aMust').forEach(e=>e.remove());

/* ---------- pose lengan (derajat: bahu, siku) ---------- */
const POSES={
 rest:[[8,-4],[8,-4]], walk:[[0,0],[0,0]],
 hips:[[48,-100],[48,-100]],
 plead:[[-28,-112],[-28,-112]],
 point:[[8,-4],[-100,-10]],
 wave:[[8,-4],[-150,-30]],
 shrug:[[40,-130],[40,-130]],
 coy:[[-20,-118],[-20,-118]],
 relax:[[60,-60],[60,-60]],
 laugh:[[-10,-130],[30,-60]],
};
function setPose(p,pose,t,walking,mix){
 let A=POSES[pose]||POSES.rest;
 if(mix){const B=POSES[mix.from]||POSES.rest;const k=ease(mix.k);A=A.map((a,i)=>a.map((v,j)=>lerp(B[i][j],v,k)));}
 let sw=walking?Math.sin(t*10)*22:0;
 $(p+'AL').setAttribute('transform',`rotate(${A[0][0]+sw})`);$(p+'ALf').setAttribute('transform',`translate(0,92) rotate(${A[0][1]})`);
 $(p+'AR').setAttribute('transform',`rotate(${A[1][0]-sw})`);$(p+'ARf').setAttribute('transform',`translate(0,92) rotate(${A[1][1]})`);
 const lg=walking?Math.sin(t*10)*16:0;
 $(p+'LL').setAttribute('transform',`translate(-30,-205) rotate(${lg})`);$(p+'LR').setAttribute('transform',`translate(30,-205) rotate(${-lg})`);
}
/* ---------- ekspresi ---------- */
const BROWS={
 neutral:['M-50 -34 q16 -8 32 0','M18 -34 q16 -8 32 0'],
 angry:['M-50 -42 l34 14','M16 -28 l34 -14'],
 shock:['M-50 -50 q16 -10 32 0','M18 -50 q16 -10 32 0'],
 plead:['M-50 -30 l32 -12','M18 -42 l32 12'],
 lazy:['M-50 -30 l32 0','M18 -30 l32 0'],
 sweet:['M-50 -40 q16 -10 32 0','M18 -40 q16 -10 32 0'],
};
const MOUTH={neutral:'M-14 0 q14 10 28 0',smile:'M-22 -2 q22 22 44 0',angry:'M-18 8 q18 -14 36 0',lazy:'M-14 2 l28 -2',sweet:'M-24 -4 q24 26 48 0',smirk:'M-16 2 q20 10 30 -8'};
function setFace(p,expr,talk,t,look,blinkOff){
 const ex={neutral:['neutral','neutral','o'],angry:['angry','angry','o'],shock:['shock','neutral','o'],plead:['plead','smile','o'],
  lazy:['lazy','lazy','o'],sweet:['sweet','sweet','h'],laugh:['sweet','sweet','h'],happy:['neutral','smile','o'],smirk:['neutral','smirk','o'],rant:['angry','angry','o']}[expr]||['neutral','neutral','o'];
 const b=BROWS[ex[0]];$(p+'BrL').setAttribute('d',b[0]);$(p+'BrR').setAttribute('d',b[1]);
 let eyes=ex[2];
 if(eyes==='o'&&((t+blinkOff)%3.1)<0.11)eyes='c';
 $(p+'EyesO').style.opacity=eyes==='o'?1:0;$(p+'EyesC').style.opacity=eyes==='c'?1:0;$(p+'EyesH').style.opacity=eyes==='h'?1:0;
 const big=expr==='shock'?1.3:expr==='plead'?1.2:1;
 ['L','R'].forEach(s=>{$(p+'Sc'+s).setAttribute('rx',17*big);$(p+'Sc'+s).setAttribute('ry',19*big);
   $(p+'Pu'+s).setAttribute('transform',`translate(${look*6},${expr==='lazy'?4:0}) scale(${expr==='shock'?.6:expr==='plead'?1.25:1})`);});
 $(p+'Lid').style.opacity=expr==='lazy'?1:0;
 $(p+'Red').style.opacity=(expr==='angry'||expr==='rant')?0.18:0;
 ['BlL','BlR'].forEach(x=>$(p+x).style.opacity=(expr==='sweet'||expr==='plead'||expr==='laugh')?1:0.45);
 const m=$(p+'MT'),mi=$(p+'MI');
 if(talk>0.06||expr==='shock'||expr==='laugh'){
   let a=expr==='shock'&&talk<=0.06?0.7:talk; if(expr==='laugh')a=Math.max(a,.55);
   m.setAttribute('ry',4+a*20);m.setAttribute('rx',expr==='laugh'?22+a*6:13+a*6);m.style.opacity=1;mi.style.opacity=0;
 } else {m.style.opacity=0;mi.style.opacity=1;mi.setAttribute('d',MOUTH[ex[1]]);}
}

/* ---------- keyframe karakter ---------- */
// tiap key: {t, x, face(1 kanan/-1 kiri), pose, expr, sit, vis, look}
function track(keys,t){
 let a=keys[0],b=null;
 for(let i=0;i<keys.length;i++){if(keys[i].t<=t){a=keys[i];b=keys[i+1]||null;}}
 const st=Object.assign({},a);
 // interpolasi posisi (jalan) bila key berikut punya walk:true
 if(b&&b.walk&&b.x!==undefined){const k=clamp((t-a.t)/(b.t-a.t),0,1);st.x=lerp(a.x,b.x,k);st.walking=k<1;st.face=b.x>a.x?1:-1;}
 return st;
}
function fill(keys){let cur={};return keys.map(k=>cur=Object.assign({},cur,k));}

let TL,C,SK,IK,CAM,AK;
window.setTimeline=function(tl){
 TL=tl;C=tl.clips;
 const s=i=>C[i].s,e=i=>C[i].e;
 // ===== SUAMI =====
 SK=fill([
  {t:0,x:390,face:1,pose:'rest',expr:'neutral',sit:0,vis:1,look:1},
  {t:0.2,x:390},{t:2.6,x:900,walk:true},
  {t:2.7,look:-1},
  {t:s(4),expr:'lazy',pose:'shrug'},{t:e(4)+.1,pose:'rest'},
  {t:s(5),expr:'lazy'},
  {t:s(6),expr:'neutral',pose:'hips'},
  {t:e(7)-1.0,look:-1},
  {t:s(8),pose:'rest',expr:'neutral'},
  {t:e(8)+.3,x:760,sit:1,pose:'relax',expr:'neutral',look:1},
  {t:e(11)+.6,expr:'smirk',look:1},
  {t:s(12),expr:'happy'},
  {t:s(13)+.5,sit:0,pose:'rest',expr:'happy'},{t:s(13)+.6,x:760},{t:s(13)+2.0,x:1000,walk:true},
  {t:s(13)+2.1,look:1,pose:'wave'},
 ]);
 // ===== ISTRI =====
 IK=fill([
  {t:0,x:390,face:1,pose:'rest',expr:'neutral',sit:0,vis:0,look:1,sandal:0},
  {t:1.6,vis:1},
  {t:s(1)-.1,x:390},{t:e(1)+.3,x:700,walk:true},
  {t:s(3),expr:'happy',pose:'point'},{t:e(3)+.1,pose:'rest'},
  {t:s(5),expr:'plead',pose:'plead'},
  {t:s(6)+.4,expr:'happy',pose:'rest'},
  {t:s(7)+1.2,x:700},{t:e(7)+.2,x:390,walk:true},
  {t:e(7)+.25,vis:0},
  {t:s(9)-1.0,vis:1,sandal:1,x:390,expr:'happy',pose:'wave'},
  {t:e(9)+.1,pose:'rest'},
  {t:e(9)+.25,x:390},{t:s(10)-.1,x:1200,walk:true},
  {t:s(10),expr:'rant',pose:'hips',look:1},
  {t:s(10)+2.4,pose:'point'},{t:s(10)+4.2,pose:'hips'},
  {t:s(11),face:-1,look:1,expr:'angry',pose:'rest'},
  {t:e(11)+.25,expr:'shock',look:-1,pose:'rest'},
  {t:s(13)-.2,expr:'sweet',pose:'coy',look:-1},
 ]);
 // ===== KAMERA: {t, cx, cy, z, pan(durasi transisi; 0=potong)} =====
 CAM=[
  {t:0,cx:640,cy:690,z:1.0,pan:0},
  {t:s(2)-.1,cx:880,cy:540,z:1.9,pan:0},
  {t:s(3)-.1,cx:800,cy:650,z:1.22,pan:0},
  {t:s(4),cx:850,cy:600,z:1.45,pan:.35},
  {t:s(5)-.1,cx:700,cy:540,z:1.85,pan:0},
  {t:s(6)-.1,cx:800,cy:650,z:1.25,pan:0},
  {t:s(7)+.9,cx:640,cy:690,z:1.0,pan:.6},
  {t:s(8)-.1,cx:900,cy:580,z:1.6,pan:0},
  {t:e(8)+.3,cx:390,cy:640,z:1.65,pan:0},
  {t:e(9)+.25,cx:1580,cy:690,z:1.15,pan:0},
  {t:s(10)-.25,cx:1370,cy:640,z:1.25,pan:0},
  {t:s(10)+3,cx:1290,cy:560,z:1.6,pan:1.2},
  {t:s(11),cx:1370,cy:640,z:1.25,pan:0},
  {t:e(11)+.05,cx:990,cy:700,z:1.0,pan:.45},
  {t:s(12),cx:840,cy:600,z:1.5,pan:0},
  {t:s(13)-.1,cx:1020,cy:660,z:1.08,pan:0},
 ];
 window.ANAK_T=s(14)-.6;
};
function camAt(t){
 let i=0;for(let k=0;k<CAM.length;k++)if(CAM[k].t<=t)i=k;
 const c=CAM[i],p=CAM[i-1]||c;
 const k=c.pan?ease((t-c.t)/c.pan):1;
 return {cx:lerp(p.cx,c.cx,k),cy:lerp(p.cy,c.cy,k),z:lerp(p.z,c.z,k),cutAt:c.t};
}
function talkAmp(who,t){
 for(const c of C){if(c.who===who&&t>=c.s&&t<c.e){const f=(t-c.s)*TL.fps;const i=Math.floor(f);return ((c.env[i]||0)+(c.env[i+1]||0))/2;}}
 return 0;
}
function drawChar(p,st,t,talk,blinkOff,scale){
 const walking=!!st.walking;
 const bob=walking?-Math.abs(Math.sin(t*10))*10:Math.sin(t*2+blinkOff)*2;
 $(p+'Root').setAttribute('transform',`translate(${st.x},${st.y||960}) scale(${(st.face||1)*(scale||1)},${scale||1})`);
 $(p+'Root').style.opacity=st.vis===undefined?1:st.vis;
 $(p+'Stand').style.opacity=st.sit?0:1;$(p+'Sit').style.opacity=st.sit?1:0;
 const sitDY=st.sit?95:0;
 const tk=talk>0.06?Math.sin(t*14)*2:0;
 $(p+'Upper').setAttribute('transform',`translate(0,${sitDY+bob}) rotate(${st.expr==='rant'?Math.sin(t*6)*2:0})`);
 $(p+'Head').setAttribute('transform',`translate(0,${-505+tk}) rotate(${(talk>0.06?Math.sin(t*5)*3:0)+(st.expr==='lazy'?-6:0)})`);
 setPose(p,walking?'walk':st.pose,t,walking,null);
 // arah pandang: look dikalikan face agar konsisten di layar
 setFace(p,st.expr,talk,t,(st.look||0)*(st.face||1),blinkOff);
 document.querySelectorAll('.'+p+'sandal').forEach(e=>e.style.opacity=st.sandal?1:0);
}

window.render=function(t){
 const s=i=>C[i].s,e=i=>C[i].e;
 const inKid=t>=window.ANAK_T;
 $('scene1').style.opacity=inKid?0:1;$('scene2').style.opacity=inKid?1:0;
 $('topText').style.opacity=inKid?0:1;
 if(!inKid){
  const cam=camAt(t);
  $('world').setAttribute('transform',`translate(360,640) scale(${cam.z}) translate(${-cam.cx},${-cam.cy})`);
  const ss=track(SK,t),is=track(IK,t);
  // istri di balik pintu: muncul dari pintu (pintu terbuka saat dia keluar/masuk)
  drawChar('s',ss,t,talkAmp('SUAMI',t),1.3);
  drawChar('i',is,t,talkAmp('ISTRI',t),0);
  // kejutan: istri melompat kaget
  if(t>e(11)+.25&&t<e(11)+.75){const k=(t-e(11)-.25)/.5;$('iRoot').setAttribute('transform',`translate(${is.x},${960-Math.sin(k*Math.PI)*40}) scale(${is.face},1)`);}
  // pintu terbuka saat istri lewat
  const doorOpen=(t>1.3&&t<3.6)||(t>e(7)-.6&&t<e(7)+.6)||(t>s(9)-1.3&&t<e(9)+.9);
  $('doorLeaf').style.opacity=doorOpen?0:1;
  // keringat suami saat dimarahi? (tidak, dia santai) -> keringat istri saat ketahuan
  $('iSweat').style.opacity=(t>e(11)+.3&&t<s(13)-.2)?1:0;
  $('sSweat').style.opacity=0;
  // urutan gambar: istri di depan suami
  // efek
  const toScreen=(wx,wy)=>[360+(wx-cam.cx)*cam.z,640+(wy-cam.cy)*cam.z];
  const bang=t>e(11)+.25&&t<s(13)-.2; $('fxBang').style.opacity=bang?1:0;
  if(bang){const [x,y]=toScreen(is.x+70,380);$('fxBang').setAttribute('x',x);$('fxBang').setAttribute('y',y);
   $('fxBang').setAttribute('transform',`rotate(${Math.sin(t*20)*6} ${x} ${y})`);}
  const anger=t>s(10)&&t<e(10); $('fxAnger').style.opacity=anger?(Math.sin(t*8)>-.3?1:.6):0;
  if(anger){const [x,y]=toScreen(is.x+60,390);$('fxAnger').setAttribute('x',x);$('fxAnger').setAttribute('y',y);}
  const hearts=t>s(13)&&t<s(14); $('fxHearts').style.opacity=hearts?1:0;
  if(hearts){const [x,y]=toScreen(is.x-40,400-(t-s(13))*40);$('fxHearts').setAttribute('x',x);$('fxHearts').setAttribute('y',y);}
  const clock=t>e(8)+.3&&t<s(9)-.9; $('fxClock').style.opacity=clock?1:0;$('fxClock').setAttribute('x',360);$('fxClock').setAttribute('y',300);
  $('flash').style.opacity=t>e(11)+.05&&t<e(11)+.2?.6:0;
 } else {
  const k=t-window.ANAK_T;
  const talk=talkAmp('ANAK',t);
  const st={x:360+Math.sin(k*18)*6,y:1500,face:1,pose:'laugh',expr:'laugh',sit:0,vis:1,look:0};
  drawChar('a',st,t,talk,0,2.0);
  $('aUpper').setAttribute('transform',`translate(0,${Math.abs(Math.sin(k*16))*-10}) rotate(${Math.sin(k*9)*5})`);
  ['h1','h2','h3'].forEach((id,i)=>{$(id).style.opacity=(k*3-i)%3<2?1:0;});
 }
 $('fade').style.opacity=t>TL.total-.8?ease((t-TL.total+.8)/.8):0;
 // subtitle
 const cur=C.find(c=>t>=c.s-.05&&t<c.e+.35);
 if(cur){
  $('sub').style.opacity=1;
  const long=cur.text.length>90, maxc=long?40:32;
  const words=cur.text.split(' '),lines=[''];
  for(const w of words){const L=lines[lines.length-1];if((L+' '+w).trim().length>maxc&&L)lines.push(w);else lines[lines.length-1]=(L+' '+w).trim();}
  ['subT1','subT2','subT3'].forEach(id=>$(id).setAttribute('font-size',long?27:32));
  const ys=lines.length===1?[1155]:lines.length===2?[1135,1180]:[1115,1155,1195];
  ['subT1','subT2','subT3'].forEach((id,i)=>{$(id).textContent=lines[i]||'';if(ys[i])$(id).setAttribute('y',ys[i]);});
  const col={SUAMI:'#e74c3c',ISTRI:'#3498db',ANAK:'#f39c12'}[cur.who];
  $('tag').setAttribute('fill',col);$('tagT').textContent=cur.who;
 } else $('sub').style.opacity=0;
};
</script></body></html>
